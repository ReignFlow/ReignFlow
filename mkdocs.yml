site_name: ReignFlow
site_description: Preview of the ReignFlow user documentation; the public code release is being prepared
site_url: https://reignflow.github.io/ReignFlow/
repo_url: https://github.com/ReignFlow/ReignFlow
repo_name: ReignFlow/ReignFlow
edit_uri: edit/main/docs/
strict: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: reignflows/mark
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

not_in_nav: |
  /acknowledgements.md

nav:
  - Getting Started:
      - Overview: index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - guides/index.md
      - Data:
          - CAMELS and Profiles: data/camels.md
          - Your Own Daily Data: data/custom-data.md
          - Select Stations: guides/station-selection.md
          - Variables and Periods: guides/data-selection.md
      - Models:
          - Choose a Model: models/overview.md
          - LSTM: models/lstm.md
          - Transformer: models/transformer.md
          - Differentiable HBV: models/dhbv.md
      - Training and Evaluation:
          - Experiment Workflow: guides/training.md
          - Training Controls: guides/training-control.md
          - Validation and Selection: guides/validation-and-model-selection.md
          - Forecasting: guides/forecast.md
          - GPU Jobs on Slurm: guides/hpc.md
      - Reuse Models:
          - Resume and Warm Start: guides/resume-and-warm-start.md
          - Evaluate and Share: guides/evaluate-and-share.md
          - HBV Parameter Files: guides/hbv-parameters.md
      - Troubleshooting: reference/troubleshooting.md
  - Examples:
      - tutorials/index.md
      - LSTM on CAMELS: tutorials/first-lstm.md
      - Transformer: tutorials/transformer.md
      - Differentiable HBV: tutorials/dhbv.md
      - Custom Daily Data: tutorials/custom-data.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - Run Outputs: reference/outputs.md
      - Checkpoints and Provenance: guides/checkpoints.md
      - Metrics: reference/metrics.md
      - Validation Record: reference/validation.md
      - Benchmarks: reference/benchmarks.md
  - Development:
      - development/index.md
      - Add a Model: development/model-integration.md
      - Testing: development/testing.md
      - Documentation and Pages: development/documentation.md
      - PyCharm Debugging: development/pycharm.md
      - Contributing: development/contributing.md
